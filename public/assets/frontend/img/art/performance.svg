<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img"
     aria-label="Core Web Vitals scores and request count comparison">
<rect width="760" height="340" rx="18" fill="#F6F7F8"/>
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
<linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#F0705F"/><stop offset="1" stop-color="#D73729"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#D73729" stop-opacity=".34"/>
  <stop offset="1" stop-color="#D73729" stop-opacity="0"/></linearGradient>
<linearGradient id="fade2" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#3B82F6" stop-opacity=".30"/>
  <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A0F14" flood-opacity=".38"/></filter>
<filter id="soft2" x="-20%" y="-20%" width="140%" height="150%">
  <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A0F14" flood-opacity=".22"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
  <circle cx="1.5" cy="1.5" r="1.1" fill="#2C3843" opacity=".55"/></pattern>
</defs>
<text x="42" y="58" font-family="ui-monospace, monospace" font-size="10.5" fill="#7A8894" letter-spacing="1.4">MEASURED ON THIS BUILD</text>
<text x="42" y="94" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#141A1F">Four requests. 155ms to content.</text>
<g>
<circle cx="120" cy="208" r="48" fill="none" stroke="#E4E8EB" stroke-width="11"/>
<circle cx="120" cy="208" r="48" fill="none" stroke="#12B981" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="298.6 301.6"
        transform="rotate(-90 120 208)"/>
<text x="120" y="210" font-family="system-ui, sans-serif" font-size="21" font-weight="800"
      fill="#141A1F" text-anchor="middle">0.9s</text>
<text x="120" y="228" font-family="ui-monospace, monospace" font-size="9" fill="#7A8894"
      text-anchor="middle" letter-spacing="1">LCP</text></g>
<g>
<circle cx="268" cy="208" r="48" fill="none" stroke="#E4E8EB" stroke-width="11"/>
<circle cx="268" cy="208" r="48" fill="none" stroke="#12B981" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="292.5 301.6"
        transform="rotate(-90 268 208)"/>
<text x="268" y="210" font-family="system-ui, sans-serif" font-size="21" font-weight="800"
      fill="#141A1F" text-anchor="middle">42ms</text>
<text x="268" y="228" font-family="ui-monospace, monospace" font-size="9" fill="#7A8894"
      text-anchor="middle" letter-spacing="1">INP</text></g>
<g>
<circle cx="416" cy="208" r="48" fill="none" stroke="#E4E8EB" stroke-width="11"/>
<circle cx="416" cy="208" r="48" fill="none" stroke="#12B981" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="301.6 301.6"
        transform="rotate(-90 416 208)"/>
<text x="416" y="210" font-family="system-ui, sans-serif" font-size="21" font-weight="800"
      fill="#141A1F" text-anchor="middle">0.00</text>
<text x="416" y="228" font-family="ui-monospace, monospace" font-size="9" fill="#7A8894"
      text-anchor="middle" letter-spacing="1">CLS</text></g>
<g filter="url(#soft2)">
<rect x="510" y="150" width="216" height="116" rx="12" fill="#FFFFFF" stroke="#E4E8EB"/>
<text x="530" y="176" font-family="ui-monospace, monospace" font-size="9.5" fill="#7A8894" letter-spacing="1.2">REQUESTS TO FIRST PAINT</text>
<text x="530" y="200" font-family="system-ui, sans-serif" font-size="11" fill="#7A8894">Previous build</text>
<rect x="530" y="208" width="176" height="12" rx="6" fill="#E4E8EB"/>
<rect x="530" y="208" width="164" height="12" rx="6" fill="#D73729" opacity=".3"/>
<text x="700" y="204" font-family="ui-monospace, monospace" font-size="10" fill="#7A8894" text-anchor="end">34</text>
<text x="530" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#7A8894">This build</text>
<rect x="530" y="250" width="176" height="12" rx="6" fill="#E4E8EB"/>
<rect x="530" y="250" width="21" height="12" rx="6" fill="#12B981"/>
<text x="700" y="246" font-family="ui-monospace, monospace" font-size="10" fill="#12B981" text-anchor="end">4</text>
</g>
<g font-family="ui-monospace, monospace" font-size="10" fill="#7A8894" letter-spacing="1">
<text x="42" y="300">NO HERO VIDEO</text><text x="220" y="300">NO FRAMEWORK</text>
<text x="404" y="300">40KB CSS, CACHED</text></g>
</svg>