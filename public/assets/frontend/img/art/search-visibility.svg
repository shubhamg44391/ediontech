<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img"
     aria-label="Search visibility growth with ranking positions and AI citations">
<defs>
<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
<linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1">
